<!DOCYTYPR html> <!-- Abertura de um código html -->
<html lang = "pt-br"> <!-- Inicio do código e definição de idioma -->
<head> <!-- Abertura do topo do documento-->
	<meta charset = "UTF-08"> <!-- definição de teclado -->
	<title>Exemplo</title> <!-- Mudança de título da página -->
</head> <!-- Fechamento do topo do documento -->
<body> <!-- Abertura do corpo do código -->
	<header> <!-- Cabeçalho -->
		<h1>Título da Página</h1> <!-- Escrita de um título -->
		<nav> <!-- Definir uma seção de uma página voltada para a navegação -->
			<p>Home</p> <!-- Escrita de um páragrafo -->
		</nav>  <!-- fechar uma seção de uma página voltada para a navegação -->
		</header><!-- Fechamento de Cabeçalho -->
		<main> <!-- especifica o conteúdo principal do documento -->
			<article> <!-- especifica conteúdo independente e autossuficiente -->
			 <h2>Artigo 1</h2> <!-- Escrita de um subtítulo -->
			 <p>Este é um artigo sobre ... </p> <!-- Escrita de um páragrafo -->
			</article> <!-- Fechamento do conteúdo -->
			<article> <!-- especifica conteúdo independente e autossuficiente -->
			 <h2>Artigo 2</h2>
			 <p> Este é outro artigo sobre ...</p> <!-- Escrita de um páragrafo -->
			</article>  <!-- Fechamento do conteúdo -->
		</main> <!-- Fechamento do conteúdo principal do documento -->
		<footer> <!-- Abertura de um rodapé -->
			<p>&copy; 2024 Exemplo </p> <!-- Escrita de um páragrafo -->
		</footer> <!-- Fechamento de um rodapé -->
	</body> <!-- Fechamento do corpo do texto -->
	</html> <!-- fim do código -->
