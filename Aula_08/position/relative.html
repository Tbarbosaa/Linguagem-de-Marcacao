<!DOCTYPE html>
    <html lang = "pt-br">
        <head>
            <meta charset = "UTF-8">
            <title> Relative </title>
            <style>
                .static{
                    position: static;
                    border: 3px solid #73ad21;
                    margin-top: 50%;
                }
                .relative{
                    position: relative;
                    border: 3px solid #73ad21;
                    margin-left: 30px;
                }
            </style>
        </head>
        <body>
            <div class = "static">
                <p> Essa div tem o estilo position: static;</p>
            </div>
             <div class = "relative">
                <p> Essa div tem o estilo position: static;</p>
            </div>
        </body>
    </html>
