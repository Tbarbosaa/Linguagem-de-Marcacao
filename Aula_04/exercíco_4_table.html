<!DOCTYPE html>
<html lang = "pt-br">

	<head>
		<meta charset = "UTF-8">
		<title> Exemplo 2 - Tabela</title>
	</head>
	<body>
		<table border = "1" width = "100%">
			<tr>
				<th rowspan = "3"> Day </th>
				<th colspan = "3"> Seminar </th>
			</tr>
			<tr>
				<th colspan = "2"> Schedule </th>
				<td rowspan = "2"  style = "text-align: center"><b> Topic </b></td>
			</tr>
			<tr>
				<th> Begin </th>
				<th> End </th>
			</tr>
			<tr>
				<td rowspan = "2"> Monday </td>
				<td rowspan = "2" style = "background-color: #FFFFCD; text-align: center"> 8:00 am </td>
				<td rowspan = "2" style = "background-color: #CDCEFF; text-align: center"> 5:00 pm </td>
				<td style = "text-align: center"> Introduction to XML </td>
			</tr>
			<tr>
				<td style = "text-align: center"> Validity: DTD and Relax NG </td>
			</tr>
			<tr>
				<td rowspan = "3"> Tuesday </td>
				<td style = "background-color: #FFFFCD; text-align: center"> 8:00 am </td>
				<td style = "background-color: #FFFFCD; text-align: center"> 11:00 am </td>
				<td rowspan = "2" style = "text-align: center"> XPath </td>
			</tr>
			<tr>
				<td style = "background-color: #FFFFCD; text-align: center"> 11:00 am </td>
				<td style = "background-color: #CDFFCD; text-align: center"> 2:00 pm </td>
			</tr>
			<tr>
				<td style = "background-color: #CDFFCD; text-align: center"> 2:00 pm </td>
				<td style = "background-color: #CDCEFF; text-align: center"> 5:00 pm </td>
				<td style = "text-align: center"> XSL Transformations </td>
			</tr>
			<tr>
				<td> Wedsneyday </td>
				<td style = "background-color: #FFFFCD; text-align: center"> 8:00 am </td>
				<td style = "background-color: #CDFFCD; text-align: center"> 12:00 pm</td>
				<td style = "text-align: center"> XSL Formatting Objects</td>
			</tr>
		</table>
	</body>
</html>
